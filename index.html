<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-mark.svg" />
    <title>Murim</title>
    <!-- last applied theme (src/appearance.ts caches it) before React mounts: no flash of the default colours -->
    <script>try { for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem("murim.appearance.vars") || "{}"))) document.documentElement.style.setProperty(k, v); } catch {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
