name: Release

# Push a tag like v0.2.0 to build an Apple Silicon .dmg and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Murim ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # ponytail: Apple Silicon only; ort (fastembed) has no prebuilt x86_64-apple-darwin binaries. Intel needs ort built from source.
          args: --bundles dmg
          releaseBody: |
            Download the `.dmg` below, open it, and drag Murim into Applications. Requires an Apple Silicon Mac (M1 or newer).

            Murim isn't signed by Apple yet, so macOS blocks the first launch. Either try to open it, then go to
            System Settings → Privacy & Security → **Open Anyway**, or run `xattr -cr /Applications/Murim.app` once.

            Requires Claude Code (`claude`), the GitHub CLI (`gh auth login`) and a Linear personal API key. See the README.
