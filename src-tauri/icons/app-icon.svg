<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- generated from src/assets/logo.svg without the glow (crisp at small sizes): macOS icon grid (412/512 rounded square), blade scaled 1.8x to read at small sizes -->
  <defs>

    <!-- Linear Gradient for Blade Facets -->
    <linearGradient id="bladeMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="60%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="bladeHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Background Light Soft Radial Gradient -->
    <radialGradient id="bgLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </radialGradient>
  </defs>
  <clipPath id="tile"><rect x="50" y="50" width="412" height="412" rx="92" /></clipPath>
  <g clip-path="url(#tile)">
    <g transform="translate(50 50) scale(0.8046875)">
      <rect width="512" height="512" fill="url(#bgLight)" />
  <g transform="translate(251 250) scale(1.8) translate(-251 -250)"><g>

    <!-- Left / Upper Facet -->
    <path d="M 180 340 L 310 200 L 322 160 Z" fill="url(#bladeHighlight)" />

    <!-- Right / Lower Facet (Adds the 3D blade edge) -->
    <path d="M 180 340 L 310 200 L 305 185 Z" fill="url(#bladeMain)" />
  </g></g>
    </g>
  </g>
</svg>
