[package]
name = "murim"
version = "0.3.10"
description = "One pane of glass for AI feature development"
license = "MIT"
repository = "https://github.com/Zachary-Love/Murim"
edition = "2021"

[lib]
name = "murim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
ureq = { version = "2", features = ["json"] }
fastembed = "5"
portable-pty = "0.8"
tiny_http = "0.12"
rand = "0.8"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# ponytail: desktop-only app, so no cfg(desktop) target gating
tauri-plugin-updater = "2"
chrono = "0.4"
